# Render Blueprint — https://render.com/docs/blueprint-spec
# After first deploy, add secret env vars in the dashboard (Mongo URI, JWT, Cloudinary, etc.).

services:
  - type: web
    name: tw-quantus
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/ping
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: MONGODB_DB_NAME
        value: TW-Quantus
      # Dashboard secrets (same keys as server/.env.production.example):
      # MONGODB_URI, ADMIN_*, CLOUDINARY_*, NEWS_API_KEY, etc.
