[build]
  command = "pnpm build:client"
  publish = "dist/spa"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "10.14.0"

[functions]
  external_node_modules = ["express"]
  node_bundler = "esbuild"

# Proxy API to Render (backend). Browser stays on twquantus.netlify.app; no CORS for /api.
[[redirects]]
  from = "/api/*"
  to = "https://t-w-quantus.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
